<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Small Wins · revised flow prototype</title>
<style>
:root{--ink:#101b46;--muted:#58658a;--blue:#2385ff;--line:#e2eaf6;--bg:#f6faff;--radius:16px}*{box-sizing:border-box}body{margin:0;font:16px/1.5 Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button,a,input,select{outline-offset:4px}button:focus-visible,a:focus-visible{outline:3px solid #7666ad}button,a{touch-action:manipulation}button{cursor:pointer;min-height:44px;border:0;background:none;color:inherit;border-radius:12px;padding:10px 16px}button:hover{background:#edf3fc}a{color:#176dd1}h1,h2,h3,p{margin:0}h1{font-size:34px;line-height:1.2;letter-spacing:-.025em}h2{font-size:23px;line-height:1.3}h3{font-size:18px}p{color:var(--muted)}small{font-size:14px;color:var(--muted)}svg.icon{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}button svg{vertical-align:middle;margin-right:9px}.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}.sidebar{padding:25px 16px;background:#fafcff;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:26px}.brand{font-size:24px;font-weight:750;color:#123e41;padding:0 12px}.brand svg{color:#459687}.avatar{width:72px;height:72px;border-radius:50%;background:#edf5ff;overflow:hidden;margin-bottom:8px}.person{padding:0 14px}.person strong{display:block}.nav{display:grid;gap:8px}.nav button{text-align:left;color:var(--muted)}.nav button.active{background:#eaf2ff;color:#0875ff;font-weight:650}.sidefoot{margin-top:auto;border-top:1px solid var(--line);padding-top:15px}.content{padding:24px 32px;max-width:1450px;width:100%;margin:auto}.prototype-note{padding:9px 14px;border:1px dashed #b6c7dc;border-radius:10px;font-size:13px;color:#53617d;margin-bottom:24px}.topline,.heading,.row,.actions,.titlebar{display:flex;align-items:center;justify-content:space-between;gap:16px}.topline{margin-bottom:18px;color:var(--muted)}.topline button{background:#eef3fb}.heading{margin-bottom:24px}.heading p{margin-top:7px}.pill{border-radius:24px;padding:8px 15px;background:#eef2fc;color:#5a638c;font-size:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px}.primary{background:var(--blue);color:white;font-weight:600}.primary:hover{background:#116fde}.secondary{background:#f0f5fd;color:#1765bc;border:1px solid #dce7f5}.textbutton{color:#176dd1;padding-left:0}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:24px}.stack{display:grid;gap:20px}.art{display:block;width:100%;overflow:hidden}.habitat{position:relative;border-radius:20px;overflow:hidden;height:440px;background:#e9f3e2}.habitat>img{width:100%;height:100%;object-fit:cover;object-position:center 57%}.zone{position:absolute;border:2px solid #fff;box-shadow:0 3px 8px #183c3126;background:#fff1cf;color:#775025;font-size:20px;font-weight:700;border-radius:28px}.zone.money{left:12%;top:12%}.zone.move{right:12%;top:14%;background:#e9f2d8;color:#336e49}.zone.corner{left:50%;bottom:8%;transform:translateX(-50%);background:#f4e7dc;color:#6b5091}.map-caption{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 24px;gap:20px}.next-action{background:#eef5ff;border-color:#dce9fc}.next-action h2{margin:5px 0}.section-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}.section-tabs button{border:1px solid var(--line);background:white;color:var(--muted)}.section-tabs button.active{color:#116de2;background:#eaf2ff;border-color:#cedff8}.routine-header{display:flex;justify-content:space-between;margin-bottom:14px}.exercise-list{list-style:none;margin:0 0 18px;padding:0}.exercise-list li{border-bottom:1px solid var(--line)}.exercise-list button{width:100%;text-align:left;display:flex;align-items:center;gap:16px;padding:13px 2px}.exercise-list .num{font-size:14px;color:#677597;background:#f0f4fb;border-radius:50%;width:30px;height:30px;display:grid;place-items:center}.exercise-list small{margin-left:auto}.hint{padding:15px;background:#f4f0fc;border-radius:12px;color:#605080;font-size:14px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}.metric{padding:22px;border-radius:16px;border:1px solid #dfebff;background:#edf5ff}.metric.green{background:#eef9f2;border-color:#ddf0e4}.metric strong{font-size:38px;display:block;margin:6px 0}.metric .art{width:85px;float:right}.record{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--line);gap:15px}.record:last-child{border:0}.record small{display:block}.progress{height:10px;background:#e9edf4;border-radius:8px;margin:15px 0}.progress span{display:block;width:50%;height:100%;background:#8db79d;border-radius:8px}.goal-art{width:150px;max-height:95px;float:right}.datehead{font-size:15px;margin-top:18px;color:#546385}.save-inputs{display:grid;gap:17px}label{display:grid;gap:7px;color:#38476a;font-size:14px}input,select{width:100%;border:1px solid #cdd8e9;border-radius:10px;padding:12px;background:white;color:var(--ink);min-height:46px}input{caret-color:var(--blue)}.calc-result{background:#ecf8f0;padding:24px;border-radius:16px;margin-top:20px}.calc-result strong{font-size:32px;display:block;color:#214d3c}.setrow{display:grid;grid-template-columns:75px 1fr 1fr 55px;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}.setrow.done{color:#2c7153}.setrow.done input{background:#f1f8f3}.history-reference{background:#f1edfb;padding:19px;border-radius:14px;margin:20px 0}.focus-layout{max-width:780px;margin:0 auto}.focus-layout .heading{align-items:flex-start}.focus-layout h1{font-size:32px}.work-actions{margin:22px 0;display:flex;gap:15px;flex-wrap:wrap}.notice{margin-top:18px;padding:13px;background:#eaf4ff;color:#224f85;border-radius:12px}.mobile-nav{display:none}footer{display:flex;justify-content:space-between;margin-top:32px;color:#677496;font-size:13px}dialog{max-width:520px;width:calc(100% - 32px);border:1px solid var(--line);border-radius:18px;padding:28px;color:var(--ink)}dialog::backdrop{background:#15234066}dialog h2{margin-bottom:12px}dialog label{margin-top:16px}dialog .actions{margin-top:22px}.form-error{color:#a52f38;min-height:20px;margin-top:10px}.muted{color:var(--muted)}.no-wrap{white-space:nowrap}.account-row{padding:18px 0;border-bottom:1px solid var(--line)}.help{margin-top:16px}.long-term{margin-top:24px}summary{cursor:pointer;min-height:44px;padding:10px 0;color:#176dd1}.control-links{display:flex;gap:10px;flex-wrap:wrap}.empty{padding:30px 0;color:var(--muted)}::selection{background:#d7e9ff}button:disabled{cursor:default;opacity:.5}
@media(min-width:1500px){.habitat{height:510px}}@media(max-width:1000px){.shell{grid-template-columns:180px 1fr}.sidebar{padding:20px 10px}.content{padding:22px}.grid{grid-template-columns:1fr}.habitat{height:400px}.brand{font-size:21px}.metrics{gap:12px}.metric{padding:18px}}
@media(max-width:650px){body{font-size:16px}.shell{display:block}.sidebar{display:none}.content{padding:18px 18px 100px}.prototype-note{font-size:12px;margin-bottom:16px}.topline{font-size:14px}.topline .date{display:none}.heading{align-items:flex-start;gap:8px}.heading .pill{display:none}h1{font-size:28px}h2{font-size:21px}.panel{padding:18px}.habitat{height:320px}.zone{font-size:15px;padding:9px 12px}.zone.money{left:4%;top:14%}.zone.move{right:4%;top:16%}.zone.corner{bottom:8%;font-size:14px}.map-caption{display:block;margin-bottom:20px}.map-caption button{padding-left:0}.metrics{grid-template-columns:1fr}.metric strong{font-size:34px}.row,.actions{flex-wrap:wrap}.routine-header{gap:8px}.exercise-list small{font-size:12px}.exercise-list button{gap:9px}.mobile-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 5px calc(6px + env(safe-area-inset-bottom));z-index:5}.mobile-nav button{padding:5px 2px;font-size:12px;color:var(--muted);border-radius:10px;display:grid;justify-items:center;gap:2px}.mobile-nav svg{margin:0}.mobile-nav .active{color:#1178f5;background:#edf5ff}.setrow{grid-template-columns:44px 1fr 1fr 34px;gap:10px}.setrow input{padding:10px 8px}.focus-layout h1{font-size:28px}footer{display:none}.focus .mobile-nav{display:none}.focus .content{padding-bottom:30px}.focus .sidebar{display:none}.focus .shell{display:block}.titlebar{align-items:flex-start}.goal-art{width:100px}.work-actions .primary{width:100%}}
.content{margin:0 auto}.primary{background:#176fdb}.primary:hover{background:#125fc0}
@media(max-width:650px){.focus .topline{display:none}.focus .prototype-note{font-size:11px;line-height:1.3;margin-bottom:12px}.focus .heading{margin-bottom:12px}.focus .panel{padding:14px}.focus .history-reference{margin:12px 0;padding:12px}.focus .setrow{padding:8px 0}.focus .work-actions{margin:14px 0}.focus .help{margin-top:10px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body>
<div class="shell"><aside class="sidebar"><div class="brand" id="brand"></div><div class="person"><div class="avatar" id="avatar"></div><strong>Mochi</strong><small>Your little wins, together</small></div><nav class="nav" aria-label="Main navigation" id="nav"></nav><div class="sidefoot"><button onclick="go('settings')" id="settings-link"></button></div></aside><main class="content"><div class="prototype-note">Revised flow prototype · sample data only · no accounts or real records are changed</div><div class="topline"><span>Good morning, Mochi</span><span class="date">15 October 2026</span><button onclick="go('settings')" aria-label="Account and settings" id="profile-link"></button></div><div id="screen"></div><footer><span>Your little wins, together.</span><span>Design preview · cloud saving not connected</span></footer></main></div><nav class="mobile-nav" aria-label="Mobile navigation" id="mobile"></nav>
<dialog id="entry"><form id="entryform"><h2 id="dialog-title"></h2><p id="dialog-copy"></p><div id="dialog-fields"></div><p class="form-error" id="form-error" role="alert"></p><div class="actions"><button type="button" onclick="document.getElementById('entry').close()">Cancel</button><button class="primary" id="dialog-submit">Preview save</button></div></form></dialog>
<script>
// Isolated UX prototype: state is in memory only; no network, auth or storage writes.
const paths={home:'M3 10 12 3l9 7v10H3z M9 20v-7h6v7',money:'M3 5h16v15H3z M3 8h18v8h-6V8 M17 12h1',movement:'M3 8v8 M6 5v14 M6 12h12 M18 5v14 M21 8v8',insights:'M4 20V10 M10 20V4 M16 20V8 M22 20H2',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M12 2v3 M12 19v3 M2 12h3 M19 12h3 M5 5l2 2 M17 17l2 2 M5 19l2-2 M17 7l2-2',user:'M12 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M4 21v-3c0-6 16-6 16 0v3',heart:'M12 21 3 12C-4 2 7-1 12 6c5-7 16-4 9 6z',arrow:'M5 12h14 M13 6l6 6-6 6',back:'M15 5l-7 7 7 7',check:'m5 12 4 4 10-10'};
function icon(n){return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.arrow}"/></svg>`}
function art(name,cls=''){const r={avatar:[31,91,94,90],finance:[303,446,137,126],fitness:[718,445,136,130],connection:[1118,443,183,130]}[name];return `<svg class="art ${cls}" viewBox="${r.join(' ')}" aria-hidden="true"><image href="../01-unified-wellness-dashboard.png" width="1536" height="1024"/></svg>`}
const screens=['home','money','movement','insights'],labels=['Home','Money','Movement','Insights'];let page='home',exercise=5,finished=1,insight='money',history=false,toast='',goal=500;const exercises=['Goblet squat','Seated cable row','Chest press','Shoulder press','Leg curl','Calf raise'];
document.getElementById('brand').innerHTML=icon('heart')+' Small Wins';document.getElementById('avatar').innerHTML=art('avatar');document.getElementById('settings-link').innerHTML=icon('settings')+'Settings';document.getElementById('profile-link').innerHTML=icon('user');
function go(p){page=p;toast='';history=false;render();window.scrollTo(0,0);document.querySelector('h1')?.focus()}
function heading(title,copy=''){return `<div class="heading"><div><h1 tabindex="-1">${title}</h1>${copy?`<p>${copy}</p>`:''}</div></div>`}
function render(){document.body.classList.toggle('focus',page==='workout');let active=page==='planner'?'money':page==='workout'?'movement':page;const n=screens.map((p,i)=>`<button onclick="go('${p}')" class="${active===p?'active':''}" ${active===p?'aria-current="page"':''}>${icon(p)}${labels[i]}</button>`).join('');document.getElementById('nav').innerHTML=n;document.getElementById('mobile').innerHTML=n;document.getElementById('screen').innerHTML=({home:home,money:money,movement:movement,workout:workout,insights:insights,planner:planner,settings:settings,corner:corner}[page]||home)()+(toast?`<div class="notice" role="status">${toast}</div>`:'')}
function home(){return `${heading('Your Wellness Habitat','Your familiar home. A simpler way to find your little wins.')}<div class="habitat"><img src="assets/habitat-clean.png" alt="The original hamster habitat: savings garden, exercise terrace and connection picnic"><button class="zone money" onclick="go('money')">${icon('money')}Money</button><button class="zone move" onclick="go('movement')">${icon('movement')}Movement</button><button class="zone corner" onclick="go('corner')">${icon('heart')}Connection corner</button></div><div class="map-caption"><p>Choose a zone to explore your little wins.</p><button class="textbutton" onclick="go('insights')">This week’s insights ${icon('arrow')}</button></div><section class="panel next-action row"><div><small>Today’s movement</small><h2>Full body · 6 exercises</h2><p>Your routine, at your pace.</p></div><button class="primary" onclick="go('movement')">Open routine ${icon('arrow')}</button></section>`}
function movement(){return `${heading('Your movement, at your pace')}<div class="section-tabs"><button class="${!history?'active':''}" onclick="history=false;render()">Routines</button><button class="${history?'active':''}" onclick="history=true;render()">History</button></div>${history?historyView():`<div class="grid"><section class="panel"><div class="routine-header"><div><h2>Full body</h2><p>6 exercises · 18 sets</p></div><button class="textbutton" onclick="showRoutineEdit()">Edit routine</button></div><ol class="exercise-list">${exercises.map((e,i)=>`<li><button onclick="exercise=${i};go('workout')"><span class="num">${i+1}</span><span>${e}</span><small>3 × 8–12</small>${icon('arrow')}</button></li>`).join('')}</ol><button class="primary" onclick="exercise=0;go('workout')">Start workout</button></section><aside class="stack"><section class="panel"><h2>Your weekly rhythm</h2><p class="help">2 of 3 planned workouts recorded</p><div class="progress"><span style="width:66.67%"></span></div><small>Plans are reminders. Rest counts too.</small><div class="help"><button class="secondary" onclick="showSchedule()">View weekly plan</button></div></section><section class="hint">Routine changes apply to your next workout. An active workout keeps its saved exercises and completed sets.</section><button class="secondary" onclick="openEntry('movement')">Log other movement</button></aside></div>`}`}
function historyView(){return `<section class="panel"><h2>Calf raise · Machine</h2><p>Same exercise and equipment. Your previous loads are a reference, not a target.</p><div class="record"><div><strong>12 October 2026</strong><small>3 sets × 12 reps</small></div><strong>25 kg</strong></div><div class="record"><div><strong>8 October 2026</strong><small>3 sets × 10 reps</small></div><strong>22.5 kg</strong></div><button class="textbutton" onclick="exercise=5;go('workout')">Open calf raise ${icon('arrow')}</button><p class="help">Older custom entries without an exercise link stay in your diary. Linking them will require your confirmation.</p></section>`}
function workout(){return `<div class="focus-layout"><div class="titlebar"><button class="textbutton" onclick="go('movement')">${icon('back')}Full body</button><button class="secondary" onclick="go('movement')">Save & close</button></div><div class="row help"><p>Exercise ${exercise+1} of 6</p><label>All exercises<select aria-label="Select exercise" onchange="exercise=Number(this.value);finished=0;render()">${exercises.map((e,i)=>`<option value="${i}" ${exercise===i?'selected':''}>${i+1}. ${e}</option>`).join('')}</select></label></div><div class="help">${heading(exercises[exercise],exercise===5?'Machine':'Your selected equipment')}</div><div class="panel"><div class="history-reference"><div class="row"><strong>Last time · 12 Oct</strong><button class="textbutton" onclick="page='movement';history=true;render()">View history</button></div><p>3 sets × 12 reps · 25 kg</p><small>Sample history for this prototype.</small></div>${[0,1,2].map(i=>`<div class="setrow ${i<finished?'done':''}"><strong>Set ${i+1}</strong><label>Reps<input aria-label="Set ${i+1} reps" type="number" min="1" max="1000" value="12"></label><label>Load (kg)<input aria-label="Set ${i+1} load" type="number" min="0" max="1000" value="25"></label><span>${i<finished?icon('check'):''}</span></div>`).join('')}<div class="work-actions"><button class="primary" ${finished>=3?'disabled':''} onclick="finished++;render()">${finished>=3?'Exercise complete':`Complete set ${finished+1}`}</button><button class="secondary" onclick="toast='Rest timer preview · 60 seconds. Continue when you are ready.';render()">Rest · 60 sec</button></div><div class="row"><button class="textbutton" ${exercise===0?'disabled':''} onclick="exercise--;finished=0;render()">${icon('back')}Previous</button>${exercise<5?`<button class="textbutton" onclick="exercise++;finished=0;render()">Next exercise ${icon('arrow')}</button>`:`<button class="textbutton" onclick="showFinish()">Finish partial workout</button>`}</div><small>Design preview: input values and completed sets are illustrative; no workout is saved.</small></div></div>`}
function money(){return `${heading('Your money, with a plan')}<div class="row" style="margin-bottom:20px"><span class="pill">October 2026 · sample month</span><button class="primary" onclick="openEntry('money')">Add money entry</button></div><div class="metrics"><section class="metric">${art('finance')}<p>Left from recorded income</p><strong>S$800</strong><small>S$3,000 income − S$2,200 spending</small></section><section class="metric green"><p>Added to savings goals</p><strong>S$${goal}</strong><small>Money you recorded as set aside, not another expense.</small></section></div><div class="grid"><section class="panel"><h2>Your money entries</h2><div class="record"><div><strong>Lunch</strong><small>15 Oct · Food</small></div><strong>−S$8</strong></div><div class="record"><div><strong>Coffee</strong><small>15 Oct · Food</small></div><strong>−S$6</strong></div><div class="record"><div><strong>Train</strong><small>14 Oct · Transport</small></div><strong>−S$2</strong></div><button class="textbutton" onclick="insight='money';go('insights')">View spending history ${icon('arrow')}</button><div class="help"><button class="secondary" onclick="go('planner')">Find a small way to save</button></div></section><section class="panel"><h2>Little dreams, slowly saved</h2><p class="help">Weekend getaway</p><h3 class="help">S$${goal} of S$1,000</h3><div class="progress"><span style="width:${Math.min(100,goal/10)}%"></span></div><button class="primary" onclick="openEntry('goal')">Add to goal</button><p class="help">Record money you already set aside. This does not move money or reduce your recorded income again.</p><details><summary>Is saving income minus spending?</summary><p>That gives your recorded surplus. A goal contribution tracks how much you deliberately set aside. Keep these separate to avoid counting the same money twice.</p></details></section></div>`}
function insights(){return `${heading('Your wellness insights','Weekly review and your records, together in one place.')}<div class="row" style="margin-bottom:20px"><span class="pill">12–18 October 2026</span><small>Based on sample recorded entries</small></div><div class="section-tabs"><button class="${insight==='money'?'active':''}" onclick="insight='money';render()">Money</button><button class="${insight==='movement'?'active':''}" onclick="insight='movement';render()">Movement</button></div><section class="panel"><div class="row"><h2>${insight==='money'?'S$16 spent this week':'2 workouts recorded'}</h2><span class="pill">Newest first</span></div><p class="help">${insight==='money'?'Spending records':'Movement records'} · grouped by date</p>${insight==='money'?`<h3 class="datehead">15 October</h3><div class="record"><div>Lunch<small>Food · Expense</small></div><strong>S$8</strong></div><div class="record"><div>Coffee<small>Food · Expense</small></div><strong>S$6</strong></div><h3 class="datehead">14 October</h3><div class="record"><div>Train<small>Transport · Expense</small></div><strong>S$2</strong></div>`:`<h3 class="datehead">15 October</h3><div class="record"><div>Evening walk<small>Walk · 30 minutes</small></div><strong>30 min</strong></div><h3 class="datehead">12 October</h3><div class="record"><div>Full body<small>Strength · 45 minutes</small></div><button class="textbutton" onclick="page='movement';history=true;render()">Exercise history</button></div>`}<p class="help">Days without entries may be incomplete. They are not failed days.</p></section><details class="long-term"><summary>Progress & little wins</summary><div class="panel"><p>Your existing journey and streak details will live here, without a separate page in the navigation.</p></div></details>`}
function planner(){return `${heading('A small change','Compare a habit in plain language. Keep the decision yours.')}<div class="grid"><section class="panel"><p>Example: your cafe drinks</p><button class="textbutton" onclick="go('insights')">View the spending behind this idea ${icon('arrow')}</button><div class="save-inputs"><label>What I usually spend each time (S$)<input id="usual" type="number" min="0" value="6" oninput="calculate()"></label><label>What I would spend instead (S$)<input id="instead" type="number" min="0" value="2" oninput="calculate()"></label><label>Times per week<input id="times" type="number" min="0" max="100" step="1" value="2" oninput="calculate()"></label></div><div class="calc-result" id="result"><p>Potential saving</p><strong>S$8 / week</strong><p>About S$34.67 / month</p></div><p class="help">An estimate, not money saved yet.</p><div class="work-actions"><button class="primary" onclick="toast='Idea saved for this preview only. No money entry or savings contribution was created.';render()">Preview saving this idea</button></div></section><aside class="panel"><h2>Make room for what matters</h2><p class="help">Use your own costs and choose a change that feels manageable.</p><div style="width:160px;margin:24px auto">${art('connection')}</div><details><summary>See the longer-term estimate</summary><p>Starting savings + monthly contribution × months. These remain your assumptions, not predictions or bank balances.</p></details><p class="help">The two separate Plan A / Plan B and What-if pages become this one guided flow.</p></aside></div>`}
function calculate(){let a=Number(document.getElementById('usual').value),b=Number(document.getElementById('instead').value),n=Number(document.getElementById('times').value);const el=document.getElementById('result');if(![a,b,n].every(Number.isFinite)||a<0||b<0||n<0||n>100||!Number.isInteger(n)){el.textContent='Enter nonnegative costs and 0–100 whole times per week.';return}let v=(a-b)*n;el.innerHTML=`<p>${v>=0?'Potential saving':'Additional spending'}</p><strong>S$${Math.abs(v).toFixed(2)} / week</strong><p>About S$${(Math.abs(v)*52/12).toFixed(2)} / month</p>`}
function settings(){return `${heading('Your private corner')}<section class="panel"><h2>Account & saving</h2><div class="account-row"><strong>Google sign-in</strong><p>Proposed account flow. This prototype is not connected.</p></div><div class="account-row"><strong>One account, your devices</strong><p>Confirmed online records will load when you sign in on another device. Sharing with a partner is a separate, later feature.</p></div><div class="account-row"><strong>Before clearing browser data</strong><p>The current live app saves locally. Export a backup first. After cloud saving is implemented, only confirmed online records are recoverable after clearing local data.</p></div><div class="account-row"><strong>Visible save states</strong><p>Saving · Saved online · Offline, changes pending · Save failed · Newer version on another device</p></div><details><summary>Preferences & backup</summary><p>Keep the existing export, restore, reduced-motion and private connection preferences here.</p></details></section>`}
function corner(){return `${heading('Make room for connection','Your familiar corner remains optional and private.')}<section class="panel"><div style="width:210px;margin:0 auto 20px">${art('connection')}</div><h2>Your moments stay yours</h2><p class="help">The existing connection diary and check-ins remain accessible here. They do not share progress with another account.</p><button class="textbutton" onclick="go('home')">Back to Habitat ${icon('arrow')}</button></section>`}
let entryType='';function openEntry(type){entryType=type;document.getElementById('dialog-title').textContent=type==='goal'?'Add to Weekend getaway':type==='money'?'A little money entry':'Log other movement';document.getElementById('dialog-copy').textContent=type==='goal'?'Record money you have already set aside. This is not a bank transfer or an expense.':'Design preview only. This does not save to the live application.';document.getElementById('dialog-fields').innerHTML=type==='movement'?'<label>Activity<input name="activity" value="Evening walk" required></label><label>Minutes<input name="amount" type="number" min="1" value="30" required></label>':`${type==='money'?'<label>Type<select name="type"><option>Expense</option><option>Income</option></select></label><label>Description<input name="note" placeholder="Lunch" required></label>':''}<label>Amount (S$)<input name="amount" type="number" min="0.01" step="0.01" placeholder="50.00" required></label><label>Date<input name="date" type="date" value="2026-10-15" required></label>`;document.getElementById('form-error').textContent='';document.getElementById('entry').showModal()}
document.getElementById('entryform').addEventListener('submit',e=>{e.preventDefault();const value=Number(new FormData(e.currentTarget).get('amount'));if(!Number.isFinite(value)||value<=0)return;if(entryType==='goal')goal=Math.round((goal+value)*100)/100;document.getElementById('entry').close();toast='Preview only: your entry would be saved here. No real records changed.';render()});
function showRoutineEdit(){toast='Design rule: edits apply to the next workout. A saved active session must offer Continue saved workout or Review updated routine; completed sets are preserved.';render()}
function showSchedule(){toast='Weekly plan preview: Monday · Full body; Wednesday · Walk; Friday · Full body. The existing schedule editor stays inside Movement.';render()}
function showFinish(){toast='Completion preview: confirm finishing early, preserve all completed sets, then show the existing hamster celebration outside the workout controls.';render()}
const initial=new URLSearchParams(location.search).get('screen');if(['home','money','movement','workout','insights','planner','settings','corner'].includes(initial))page=initial;render();
</script></body></html>
